apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: flash-sale
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka_exporter:v1.7.0
          args:
            - --kafka.server=kafka.flash-sale.svc.cluster.local:9092
          ports:
            - containerPort: 9308
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: flash-sale
  labels:
    app: kafka-exporter
spec:
  selector:
    app: kafka-exporter
  ports:
    - port: 9308
      targetPort: 9308
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-exporter
  namespace: flash-sale
  labels:
    app: kafka-exporter
spec:
  selector:
    matchLabels:
      app: kafka-exporter
  endpoints:
    - port: "9308"
      interval: 15s
